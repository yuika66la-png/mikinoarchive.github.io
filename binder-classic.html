<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>card binder (classic) — mikinoarchive</title>
<meta name="description" content="Flip through the mikinoarchive collection: every piece in stock, one card at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfdfc;
    --ink: #2b2925;
    --muted: #8a8580;
    --red: #af1c17;
    --hair: #e8e4de;
    --table: #efeae2;
    --leather: #6d1512;
    --leather-deep: #4d0e0c;
    --leaf: #f8f5ef;
    --sleeve: #e9e4da;
    --gold: #b8944f;

    /* Phone: 2 × 3 pockets, one page. The page scrolls if it needs to. */
    --cols: 2;
    --rows: 3;
    --gap: 10px;
    --card-w: calc((100vw - 100px) / 2);
    --card-h: calc(var(--card-w) * 1.4);
  }

  @media (min-width: 640px) {
    :root {
      --cols: 3;
      --gap: 12px;
      --card-w: min(calc((100vw - 120px) / 3), calc((100dvh - 190px) / 4.5));
    }
  }

  @media (min-width: 1000px) {
    :root {
      --card-w: min(calc((100vw - 212px) / 6), calc((100dvh - 190px) / 4.5));
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    background: var(--table);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 12px 20px;
    overflow-x: clip;
  }

  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  /* Header */
  .top {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .brand {
    font-family: 'Alex Brush', cursive;
    font-size: 30px;
    line-height: 1;
    color: var(--red);
    text-decoration: none;
  }
  .kicker { font-size: 14px; font-style: italic; color: var(--muted); }

  /* Binder */
  .binder {
    position: relative;
    display: flex;
    padding: 12px;
    gap: 0;
    background: linear-gradient(160deg, var(--leather), var(--leather-deep));
    border-radius: 10px;
    box-shadow: 0 18px 34px -16px rgba(60, 20, 10, .55);
    perspective: 2200px;
  }

  .page {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--cols), var(--card-w));
    grid-auto-rows: var(--card-h);
    gap: var(--gap);
    padding: var(--gap) var(--gap) var(--gap) calc(var(--gap) + 20px);
    background: var(--leaf);
    border-radius: 4px;
  }
  /* Punched holes along the inner edge */
  .page::before {
    content: "";
    position: absolute;
    left: 8px;
    top: 0;
    bottom: 0;
    width: 10px;
    background: radial-gradient(circle at 5px 5px, #cfc8bb 0 4.5px, transparent 5px) 0 0 / 10px 25% repeat-y;
    background-position: 0 12.5%;
  }
  .page.mirror { padding: var(--gap) calc(var(--gap) + 20px) var(--gap) var(--gap); }
  .page.mirror::before { left: auto; right: 8px; }

  #pageRight { display: none; }

  @media (min-width: 1000px) {
    #pageRight { display: grid; }
    .binder { gap: 18px; }
    /* On a spread, the left page is punched on its spine side too */
    #pageLeft { padding: var(--gap) calc(var(--gap) + 20px) var(--gap) var(--gap); }
    #pageLeft::before { left: auto; right: 8px; }
    .binder::after {
      content: "";
      position: absolute;
      top: 12px;
      bottom: 12px;
      left: calc(50% - 9px);
      width: 18px;
      background: linear-gradient(90deg, #2e0807, var(--leather) 45%, #2e0807);
    }
  }

  /* Pockets and cards */
  .pocket {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    padding: 4px;
    border: 0;
    border-radius: 6px;
    background: var(--sleeve);
    cursor: pointer;
    box-shadow: inset 0 1px 2px rgba(70, 55, 35, .2);
  }
  .pocket.empty { cursor: default; opacity: .55; }

  /* The clear plastic sleeve sits above the card */
  .pocket:not(.empty)::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 4px;
    pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,.34) 0 16%, rgba(255,255,255,0) 30% 62%, rgba(255,255,255,.16) 74%, rgba(255,255,255,0) 86%);
  }

  .card {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 5px 5px 4px;
    background: var(--paper);
    border: 1px solid var(--red);
    border-radius: 4px;
    text-align: left;
    transition: transform .22s ease, box-shadow .22s ease;
  }
  .pocket:hover .card,
  .pocket:focus-visible .card {
    transform: translateY(-5px) rotate(-.8deg);
    box-shadow: 0 7px 12px -5px rgba(50, 30, 15, .5);
  }

  .card.signature {
    border-color: var(--gold);
    background: linear-gradient(135deg, #fffaf0, #f6ead2 48%, #fffaf0);
  }

  .card-head, .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    line-height: 1.15;
    white-space: nowrap;
  }
  .card-head { font-size: 11px; color: var(--red); margin-bottom: 3px; }
  .card.signature .card-head { color: #80622c; }
  .card-mark { font-family: 'Alex Brush', cursive; font-size: 13px; }

  .card-photo {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: block;
    object-fit: cover;
    border-radius: 2px;
    background: var(--hair);
  }

  .card-foot { font-size: 12.5px; margin-top: 3px; }
  .card-name { overflow: hidden; text-overflow: ellipsis; font-style: italic; }
  .card-price { flex: none; font-weight: 500; }

  /* Cover */
  .cover {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 20px;
    color: #f4e7d2;
    text-align: center;
    background: linear-gradient(160deg, #7c1a16, var(--leather-deep));
    border-radius: 10px;
    transform-origin: 50% 0;
    transition: transform .7s ease, opacity .7s ease;
  }
  .cover::before {
    content: "";
    position: absolute;
    inset: 16px;
    border: 1px solid var(--gold);
    border-radius: 6px;
    pointer-events: none;
  }
  .cover-title { font-family: 'Alex Brush', cursive; font-size: clamp(48px, 9vw, 76px); line-height: 1; }
  .cover-sub { font-size: 18px; font-style: italic; }
  .cover-count { font-size: 14px; letter-spacing: .08em; color: #dcc08c; }
  .open-btn {
    position: relative;
    margin-top: 16px;
    min-height: 44px;
    padding: 8px 26px;
    color: #fff8ec;
    background: transparent;
    border: 1px solid #dcc08c;
    border-radius: 3px;
    cursor: pointer;
    font-size: 17px;
  }
  .open-btn:hover { background: rgba(255, 240, 210, .14); }
  .open-btn:focus-visible { outline-color: #fff; }
  .cover[hidden] { display: none; }
  .binder.open .cover {
    transform: rotateX(70deg);
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
    transition: transform .7s ease, opacity .7s ease, visibility 0s .7s;
  }

  /* The page that swings over during a turn */
  .leaf {
    position: absolute;
    z-index: 4;
    transform-style: preserve-3d;
    pointer-events: none;
  }
  .leaf-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .leaf-face .page { width: 100%; height: 100%; }
  .leaf-back { transform: rotateY(180deg); background: var(--leaf); border-radius: 4px; }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 560px;
    margin-top: 12px;
  }
  .nav-btn {
    flex: none;
    width: 44px;
    height: 44px;
    font-size: 22px;
    line-height: 1;
    background: var(--paper);
    border: 1px solid #d8d1c5;
    border-radius: 50%;
    cursor: pointer;
  }
  .nav-btn:hover:not(:disabled) { color: var(--red); border-color: var(--red); }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .progress { flex: 1; min-width: 0; text-align: center; }
  .progress-text { display: block; font-size: 15px; font-style: italic; color: #625d55; }
  #slider { width: 100%; margin: 2px 0 0; accent-color: var(--red); }

  @media (max-width: 639px) {
    .controls {
      position: sticky;
      bottom: 8px;
      z-index: 6;
      padding: 6px 8px;
      background: rgba(253, 253, 252, .94);
      border: 1px solid var(--hair);
      border-radius: 30px;
    }
  }

  .binder:not(.open) ~ .controls { visibility: hidden; }

  /* Card viewer */
  dialog {
    width: 100%;
    max-width: 420px;
    max-height: 100dvh;
    padding: 12px;
    background: transparent;
    border: 0;
    color: var(--ink);
  }
  dialog::backdrop { background: rgba(35, 24, 18, .78); }

  .flip-scene {
    --big-h: min(calc(100dvh - 120px), calc((min(100vw, 420px) - 24px) * 1.4));
    width: calc(var(--big-h) / 1.4);
    height: var(--big-h);
    margin: 0 auto;
    perspective: 1500px;
    cursor: pointer;
  }
  .flipper {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform .6s ease;
  }
  .flipper.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 10px;
    overflow: hidden;
  }
  .face.front .card { padding: 12px 12px 10px; border-width: 2px; border-radius: 10px; }
  .face.front .card-head { font-size: 16px; margin-bottom: 7px; }
  .face.front .card-mark { font-size: 24px; }
  .face.front .card-foot { font-size: 20px; margin-top: 7px; }

  .face.back {
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    padding: 18px;
    background: var(--paper);
    border: 2px solid var(--red);
    overflow-y: auto;
    cursor: auto;
  }
  .back-mark { font-family: 'Alex Brush', cursive; font-size: 30px; line-height: 1; color: var(--red); text-align: center; }
  .back-no { font-size: 15px; font-style: italic; color: var(--muted); text-align: center; margin-bottom: 10px; }
  .back-photo {
    flex: 1 1 0;
    min-height: 90px;
    width: 100%;
    object-fit: contain;
    margin-bottom: 10px;
    border-radius: 4px;
    background: var(--hair);
  }
  .specs { margin: 0; font-size: 18px; }
  .specs div { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--hair); }
  .specs dt { color: var(--muted); font-style: italic; }
  .specs dd { margin: 0; text-align: right; }
  .shop-link {
    display: block;
    margin-top: auto;
    padding: 11px 12px;
    color: #fff;
    background: var(--red);
    border-radius: 3px;
    font-size: 18px;
    text-align: center;
    text-decoration: none;
  }
  .specs + .shop-link { margin-top: 16px; }
  .spacer { flex: 1 0 8px; }
  .spacer + .shop-link { margin-top: 0; }

  .viewer-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
  }
  .text-btn {
    min-height: 44px;
    padding: 6px 14px;
    background: var(--paper);
    border: 1px solid #d8d1c5;
    border-radius: 22px;
    cursor: pointer;
    font-size: 17px;
  }
  .text-btn:hover { color: var(--red); }

  noscript { display: block; padding: 24px; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .card, .flipper, .cover, .binder.open .cover { transition: none; }
    .pocket:hover .card, .pocket:focus-visible .card { transform: none; }
  }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="./">mikinoarchive</a>
  <span class="kicker">card binder</span>
</header>

<noscript>The binder needs JavaScript to turn its pages.</noscript>

<section class="binder" id="binder" aria-label="Card binder">
  <div class="page" id="pageLeft"></div>
  <div class="page" id="pageRight"></div>
  <div class="cover" id="cover">
    <div class="cover-title">mikinoarchive</div>
    <div class="cover-sub">the card binder</div>
    <div class="cover-count" id="coverCount"></div>
    <button class="open-btn" id="openBtn" type="button">Open the binder</button>
  </div>
</section>

<nav class="controls" aria-label="Binder pages">
  <button class="nav-btn" id="prev" type="button" aria-label="Previous page">&lsaquo;</button>
  <div class="progress">
    <span class="progress-text" id="progress" aria-live="polite"></span>
    <input id="slider" type="range" min="1" value="1" aria-label="Jump to page">
  </div>
  <button class="nav-btn" id="next" type="button" aria-label="Next page">&rsaquo;</button>
</nav>

<dialog id="viewer" aria-label="Card details">
  <div class="flip-scene" id="scene">
    <div class="flipper" id="flipper">
      <div class="face front" id="faceFront"></div>
      <div class="face back" id="faceBack"></div>
    </div>
  </div>
  <div class="viewer-bar">
    <button class="nav-btn" id="cardPrev" type="button" aria-label="Previous card">&lsaquo;</button>
    <button class="text-btn" id="flipBtn" type="button">Flip card</button>
    <button class="text-btn" id="closeBtn" type="button">Close</button>
    <button class="nav-btn" id="cardNext" type="button" aria-label="Next card">&rsaquo;</button>
  </div>
</dialog>

<script src="binder/items.js"></script>
<script>
(function () {
  var items = window.BINDER_ITEMS || [];
  var SHOP_URL = 'https://depop.com/mikinoarchivejp';
  var $ = function (id) { return document.getElementById(id); };
  var binder = $('binder'), left = $('pageLeft'), right = $('pageRight');
  var viewer = $('viewer'), flipper = $('flipper');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  var view = 0;        // index of the page (or two-page spread) on show
  var turning = false;
  var current = 0;     // index of the card open in the viewer
  var firstCard = 0;   // first card on show, kept across layout changes
  var touchX = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return String(n).padStart(3, '0'); }
  function title(it) { return it.name || it.brand || it.origin || 'Archive piece'; }

  function isSpread() { return window.innerWidth >= 1000; }
  function perPage() { return window.innerWidth >= 640 ? 9 : 6; }
  function pageCount() { return Math.max(1, Math.ceil(items.length / perPage())); }
  function viewCount() { return isSpread() ? Math.ceil(pageCount() / 2) : pageCount(); }
  function firstPageOf(v) { return isSpread() ? v * 2 : v; }
  function viewOfCard(i) {
    var p = Math.floor(i / perPage());
    return isSpread() ? Math.floor(p / 2) : p;
  }

  function cardHTML(it, full) {
    var src = (full ? 'binder/cards/' : 'binder/thumbs/') + pad(it.n) + '.jpg';
    var alt = title(it) + ', card ' + it.n;
    return '<div class="card' + (it.brand ? ' signature' : '') + '">' +
      '<div class="card-head"><span class="card-mark">mikino</span><span>No. ' + pad(it.n) + '</span></div>' +
      '<img class="card-photo" src="' + src + '" alt="' + esc(alt) + '" ' + (full ? '' : 'loading="lazy"') + '>' +
      '<div class="card-foot"><span class="card-name">' + esc(title(it)) + '</span>' +
      (it.price ? '<span class="card-price">' + esc(it.price) + '</span>' : '') + '</div>' +
      '</div>';
  }

  function pageHTML(pageIndex) {
    var per = perPage(), start = pageIndex * per, html = '';
    for (var i = start; i < start + per; i++) {
      html += items[i]
        ? '<button class="pocket" type="button" data-i="' + i + '" aria-label="Open card ' + items[i].n + ': ' + esc(title(items[i])) + '">' + cardHTML(items[i]) + '</button>'
        : '<div class="pocket empty" aria-hidden="true"></div>';
    }
    return html;
  }

  function preload(v) {
    if (v < 0 || v >= viewCount()) return;
    var first = firstPageOf(v) * perPage();
    var count = perPage() * (isSpread() ? 2 : 1);
    items.slice(first, first + count).forEach(function (it) {
      new Image().src = 'binder/thumbs/' + pad(it.n) + '.jpg';
    });
  }

  function render() {
    var p = firstPageOf(view);
    firstCard = p * perPage();
    left.innerHTML = pageHTML(p);
    right.innerHTML = isSpread() ? pageHTML(p + 1) : '';
    updateControls();
    preload(view + 1);
    preload(view - 1);
  }

  function updateControls() {
    var total = viewCount(), per = perPage() * (isSpread() ? 2 : 1);
    var from = firstPageOf(view) * perPage() + 1;
    var to = Math.min(items.length, from + per - 1);
    $('prev').disabled = view === 0;
    $('next').disabled = view >= total - 1;
    $('progress').textContent = 'Cards ' + from + '–' + to + ' of ' + items.length;
    $('slider').max = total;
    $('slider').value = view + 1;
    $('slider').setAttribute('aria-valuetext', 'Page ' + (view + 1) + ' of ' + total);
  }

  function makePage(pageIndex, mirror) {
    var el = document.createElement('div');
    el.className = 'page' + (mirror ? ' mirror' : '');
    el.innerHTML = pageHTML(pageIndex);
    el.setAttribute('inert', '');
    return el;
  }

  function makeLeaf(box, front, back) {
    var leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.style.left = box.offsetLeft + 'px';
    leaf.style.top = box.offsetTop + 'px';
    leaf.style.width = box.offsetWidth + 'px';
    leaf.style.height = box.offsetHeight + 'px';
    var f = document.createElement('div');
    f.className = 'leaf-face leaf-front';
    f.appendChild(front);
    var b = document.createElement('div');
    b.className = 'leaf-face leaf-back';
    if (back) b.appendChild(back);
    leaf.appendChild(f);
    leaf.appendChild(b);
    binder.appendChild(leaf);
    return leaf;
  }

  function goTo(target, animate) {
    target = Math.max(0, Math.min(viewCount() - 1, target));
    if (target === view || turning) return;
    var forward = target > view;
    if (!animate || reduceMotion.matches || !Element.prototype.animate) {
      view = target;
      render();
      return;
    }

    turning = true;
    var perFrom = firstPageOf(view), perTo = firstPageOf(target);
    var leaf, frames;
    if (isSpread()) {
      if (forward) {
        leaf = makeLeaf(right, makePage(perFrom + 1), makePage(perTo, true));
        leaf.style.transformOrigin = '-9px 50%';
        right.innerHTML = pageHTML(perTo + 1);
        frames = [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(-180deg)' }];
      } else {
        leaf = makeLeaf(left, makePage(perFrom, true), makePage(perTo + 1));
        leaf.style.transformOrigin = 'calc(100% + 9px) 50%';
        left.innerHTML = pageHTML(perTo);
        frames = [{ transform: 'rotateY(0deg)' }, { transform: 'rotateY(180deg)' }];
      }
    } else if (forward) {
      leaf = makeLeaf(left, makePage(perFrom));
      leaf.style.transformOrigin = '0 50%';
      left.innerHTML = pageHTML(perTo);
      frames = [{ transform: 'rotateY(0deg)', opacity: 1 }, { transform: 'rotateY(-105deg)', opacity: .4 }];
    } else {
      leaf = makeLeaf(left, makePage(perTo));
      leaf.style.transformOrigin = '0 50%';
      frames = [{ transform: 'rotateY(-105deg)', opacity: .4 }, { transform: 'rotateY(0deg)', opacity: 1 }];
    }

    var finish = function () {
      leaf.remove();
      view = target;
      turning = false;
      render();
    };
    leaf.animate(frames, { duration: 620, easing: 'cubic-bezier(.4,.1,.3,1)' }).finished.then(finish, finish);
  }

  function openBinder() {
    binder.classList.add('open');
    var cover = $('cover');
    setTimeout(function () { cover.hidden = true; }, reduceMotion.matches ? 0 : 750);
  }

  /* Card viewer */
  function showCard(i) {
    current = (i + items.length) % items.length;
    var it = items[current];
    flipper.classList.remove('flipped');
    $('faceFront').innerHTML = cardHTML(it, true);

    var rows = [['Brand', it.brand], ['Made', it.origin], ['Type', it.type], ['Color', it.color], ['Size', it.size], ['Condition', it.cond], ['Price', it.price]];
    var specs = rows.filter(function (r) { return r[1]; }).map(function (r) {
      return '<div><dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd></div>';
    }).join('');

    $('faceBack').innerHTML =
      '<div class="back-mark">mikinoarchive</div>' +
      '<div class="back-no">No. ' + pad(it.n) + ' &middot; ' + esc(title(it)) + '</div>' +
      (it.img.length > 1
        ? '<img class="back-photo" src="binder/cards/' + esc(it.img[1]) + '" alt="' + esc(title(it)) + ', second photo">'
        : '') +
      (specs ? '<dl class="specs">' + specs + '</dl>' : '') +
      '<div class="spacer"></div>' +
      '<a class="shop-link" target="_blank" rel="noopener" href="' + esc(it.url || SHOP_URL) + '">' +
      (it.url ? 'View on Depop' : 'Visit the shop on Depop') + '</a>';

    new Image().src = 'binder/cards/' + pad(items[(current + 1) % items.length].n) + '.jpg';
  }

  function openViewer(i) {
    showCard(i);
    if (!viewer.open) viewer.showModal();
  }

  function flip() { flipper.classList.toggle('flipped'); }

  /* Events */
  $('openBtn').addEventListener('click', openBinder);
  $('prev').addEventListener('click', function () { goTo(view - 1, true); });
  $('next').addEventListener('click', function () { goTo(view + 1, true); });
  $('slider').addEventListener('input', function (e) {
    if (!turning) { view = Number(e.target.value) - 1; render(); }
  });

  binder.addEventListener('click', function (e) {
    var p = e.target.closest('.pocket[data-i]');
    if (p) openViewer(Number(p.dataset.i));
  });

  binder.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  binder.addEventListener('touchend', function (e) {
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 50 && binder.classList.contains('open')) goTo(view + (dx < 0 ? 1 : -1), true);
  }, { passive: true });

  $('scene').addEventListener('click', function (e) {
    if (!e.target.closest('a')) flip();
  });
  $('flipBtn').addEventListener('click', flip);
  $('closeBtn').addEventListener('click', function () { viewer.close(); });
  $('cardPrev').addEventListener('click', function () { showCard(current - 1); });
  $('cardNext').addEventListener('click', function () { showCard(current + 1); });
  viewer.addEventListener('click', function (e) { if (e.target === viewer) viewer.close(); });
  viewer.addEventListener('close', function () {
    var v = viewOfCard(current);
    if (v !== view) { view = v; render(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.matches && e.target.matches('input')) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var step = e.key === 'ArrowRight' ? 1 : -1;
    if (viewer.open) showCard(current + step);
    else if (binder.classList.contains('open')) goTo(view + step, true);
  });

  var lastLayout = window.innerWidth >= 1000 ? 2 : window.innerWidth >= 640 ? 1 : 0;
  window.addEventListener('resize', function () {
    var layout = window.innerWidth >= 1000 ? 2 : window.innerWidth >= 640 ? 1 : 0;
    if (layout === lastLayout) return;
    lastLayout = layout;
    view = viewOfCard(firstCard);
    render();
  });

  /* Start: binder.html#open skips the cover, binder.html#23 opens card 23 */
  $('coverCount').textContent = items.length + ' cards';
  var hash = location.hash.slice(1);
  var linked = /^\d+$/.test(hash) ? Number(hash) : 0;
  if (linked >= 1 && linked <= items.length) {
    view = viewOfCard(linked - 1);
    $('cover').hidden = true;
    binder.classList.add('open');
    render();
    openViewer(linked - 1);
  } else {
    if (hash === 'open') { $('cover').hidden = true; binder.classList.add('open'); }
    render();
  }
})();
</script>
</body>
</html>
