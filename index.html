<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mikinoarchive</title>
<meta name="description" content="mikinoarchive — 80s–Y2K vintage + modern shop based in Dallas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fdfdfc;
    --ink: #2b2925;
    --red: #af1c17;
    --red-soft: #c74a3f;
    --hair: #e8e4de;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }

  .page {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .wordmark {
    display: block;
    width: 260px;
    max-width: 72%;
    margin: 0 auto;
  }

  .locale {
    margin-top: 4px;
    font-size: 15px;
    font-style: italic;
    color: #8a8580;
    letter-spacing: 0.02em;
  }

  .rule {
    width: 46px;
    height: 1px;
    background: var(--red);
    margin: 26px auto;
    opacity: 0.55;
  }

  .tagline {
    margin: 0 auto 40px;
    max-width: 30ch;
    font-size: 17px;
    line-height: 1.65;
    color: #4a4640;
  }

  .links {
    display: flex;
    flex-direction: column;
  }

  .link-row {
    display: block;
    text-decoration: none;
    color: var(--ink);
    padding: 18px 4px;
    border-bottom: 1px solid var(--hair);
    position: relative;
  }
  .links .link-row:first-child {
    border-top: 1px solid var(--hair);
  }

  .link-title {
    font-size: 19px;
    letter-spacing: 0.01em;
    transition: color 0.2s ease;
  }
  .link-row:hover .link-title {
    color: var(--red);
  }

  .link-sub {
    display: block;
    margin-top: 3px;
    font-size: 12px;
    font-style: italic;
    color: #a39d95;
  }

  footer {
    margin-top: 44px;
    font-size: 12px;
    font-style: italic;
    color: #b0aba3;
  }

  @media (max-width: 420px) {
    .wordmark { width: 220px; }
  }
</style>
</head>
